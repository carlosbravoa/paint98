name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 \
            librsvg2-common fonts-dejavu-core xvfb xauth
      - name: Run the test suite
        run: xvfb-run -a /usr/bin/python3 -m unittest -v
